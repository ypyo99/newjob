<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>새일 나침반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 화면에 한 단계. 좁은 단일 칼럼, 큰 글자와 큰 버튼, 진행 막대가 위에 고정 */
:root {
  --bg: #F1F5F3;
  --surface: #FFFFFF;
  --ink: #17221E;
  --muted: #4B5D55;
  --line: #CFDBD5;
  --accent: #1C6A4F;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0EEE7;
  --gold: #A9690A;
  --gold-soft: #F6EBD2;
  --warn: #9A3B1E;
  --warn-soft: #F8E5DD;
  --font-display: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 14px;
  --base: 19px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #17211D; --ink: #E9F1ED; --muted: #A5B7AE; --line: #2B3A33;
    --accent: #5FC39A; --accent-ink: #0B1712; --accent-soft: #1C3A2E; --gold: #E3B14C; --gold-soft: #3A2E15;
    --warn: #F0A184; --warn-soft: #3D231A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #17211D; --ink: #E9F1ED; --muted: #A5B7AE; --line: #2B3A33;
  --accent: #5FC39A; --accent-ink: #0B1712; --accent-soft: #1C3A2E; --gold: #E3B14C; --gold-soft: #3A2E15;
  --warn: #F0A184; --warn-soft: #3D231A; color-scheme: dark;
}
html { font-size: var(--base); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.65; word-break: keep-all; overflow-wrap: break-word; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 46rem; margin: 0 auto; padding: 0.6rem 16px; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin-right: auto; background: none; border: 0; padding: 0; cursor: pointer; }
.brand svg { width: 1.6rem; height: 1.6rem; }
.sizer { display: flex; gap: 0.25rem; align-items: center; }
.sizer span { font-size: 0.8rem; color: var(--muted); margin-right: 0.25rem; }
.sizer button { min-width: 2.6rem; min-height: 2.4rem; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; font-weight: 600; }
.sizer button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.slogan { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 0.8rem 0.2rem; }
.slogan img { display: block; width: min(100%, 22rem); height: auto; padding: 0.2rem 0.5rem; border-radius: 10px; background: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .slogan img { background: transparent; } }
:root[data-theme="dark"] .slogan img { background: transparent; }
.progress { height: 6px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

main { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 1.6rem 4rem; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.3; margin: 0; }
h1 { font-size: 2rem; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 1.25rem; }
.eyebrow { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em; color: var(--accent); }
.lead { font-size: 1.08rem; color: var(--muted); max-width: 36rem; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

/* intro */
.hero { display: grid; gap: 1.2rem; padding-block: 0.5rem 1rem; }
.hero h1 em { font-style: normal; color: var(--accent); }
.steps-intro { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.steps-intro li { display: grid; grid-template-columns: 2.4rem 1fr auto; gap: 0.8rem; align-items: baseline; padding: 0.85rem 0; border-bottom: 1px solid var(--line); }
.steps-intro b { font-family: var(--font-display); font-size: 1.25rem; color: var(--accent); }
.steps-intro .t { font-weight: 600; }
.steps-intro .d { display: block; color: var(--muted); font-size: 0.9rem; }
.steps-intro .m { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.note { background: var(--gold-soft); border-radius: var(--radius); padding: 0.9rem 1.1rem; font-size: 0.92rem; }

/* buttons */
.actions { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-block: 1.5rem; }
.btn { min-height: 3.4rem; padding: 0.6rem 1.5rem; border-radius: 999px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.plain { background: transparent; border-color: var(--line); color: var(--ink); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.nav { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 2rem; flex-wrap: wrap; }
.nav .btn { flex: 1 1 10rem; }
.err { color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 0.7rem 1rem; font-weight: 500; }

/* questions */
.q { display: grid; gap: 0.7rem; padding: 1.2rem 0; border-bottom: 1px solid var(--line); }
.q:last-of-type { border-bottom: 0; }
.q-label { font-weight: 600; font-size: 1.08rem; }
.q-label .n { color: var(--accent); font-family: var(--font-display); margin-right: 0.35rem; }
.choices { display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span { display: flex; align-items: center; gap: 0.6rem; min-height: 3.3rem; padding: 0.55rem 0.9rem; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; line-height: 1.35; }
.choice span::before { content: ""; flex: none; width: 1.15rem; height: 1.15rem; border: 2px solid var(--muted); border-radius: 50%; }
.choice input[type=checkbox] + span::before { border-radius: 5px; }
.choice input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.choice input:checked + span::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.choice input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.choice input:disabled + span { opacity: .45; }
.likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
.likert .choice span { flex-direction: column; justify-content: center; text-align: center; font-size: 0.82rem; padding: 0.5rem 0.2rem; min-height: 4.4rem; gap: 0.35rem; }
.scale-ends { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
input[type=text] { width: 100%; min-height: 3.3rem; padding: 0.5rem 0.9rem; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
input[type=text]:focus { border-color: var(--accent); outline: none; }
.counter { font-weight: 600; color: var(--accent); }

/* results */
.banner { background: var(--gold-soft); border-radius: var(--radius); padding: 0.8rem 1.1rem; font-size: 0.92rem; font-weight: 500; }
.profile { display: grid; gap: 0.6rem; }
.bar-row { display: grid; grid-template-columns: 6.2rem 1fr 2.6rem; gap: 0.7rem; align-items: center; }
.bar-row .lab { font-weight: 600; font-size: 0.95rem; }
.bar-row .track { height: 1rem; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--muted); border-radius: 999px; }
.bar-row.top3 .fill { background: var(--accent); }
.bar-row .val { font-variant-numeric: tabular-nums; text-align: right; font-size: 0.9rem; color: var(--muted); }
.summary { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.55; }
.summary b { color: var(--accent); }
.type-notes { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }
.type-notes div { border-top: 3px solid var(--accent); padding-top: 0.6rem; }
.type-notes h3 { font-size: 1.05rem; }

.job { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.3rem 1.3rem 1.1rem; display: grid; gap: 0.9rem; }
.job-head { display: grid; grid-template-columns: auto 1fr auto; gap: 0.9rem; align-items: start; }
.rank { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; color: var(--accent); line-height: 1; }
.job-head h3 { font-size: 1.3rem; }
.cat { font-size: 0.82rem; color: var(--muted); }
.fit { text-align: right; }
.fit b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.fit span { font-size: 0.78rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { font-size: 0.82rem; padding: 0.2rem 0.65rem; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.chip.gold { background: var(--gold-soft); }
.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.3rem; }
.why li { padding-left: 1.5rem; position: relative; }
.why li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
.why li.c::before { content: "!"; color: var(--warn); left: 0.3rem; }
.how { display: grid; gap: 0.6rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); border-top: 1px dashed var(--line); padding-top: 0.9rem; }
.how dt { font-size: 0.8rem; font-weight: 700; color: var(--muted); letter-spacing: 0.03em; }
.how dd { margin: 0.15rem 0 0; font-size: 0.95rem; }
.more { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.more li { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.more .pct { font-variant-numeric: tabular-nums; color: var(--muted); }
.channels { display: grid; gap: 0.8rem; }
.channel { display: grid; gap: 0.15rem; padding: 0.9rem 1.1rem; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 12px 12px 0; }
.channel a { color: var(--accent); font-weight: 600; word-break: break-all; }
.section-gap { margin-top: 2.6rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 0.7rem 1.3rem; border-radius: 999px; font-weight: 600; }
textarea.copybox { width: 100%; min-height: 10rem; font-size: 0.85rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0.7rem; }

@media (max-width: 30rem) {
  h1 { font-size: 1.65rem; }
  .likert .choice span { font-size: 0.72rem; }
  .bar-row { grid-template-columns: 5rem 1fr 2.3rem; }
  .job-head { grid-template-columns: auto 1fr; }
  .fit { grid-column: 1 / -1; text-align: left; display: flex; gap: 0.5rem; align-items: baseline; }
  .fit b { display: inline; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

const SCREENS = ["intro","basic","int0","int1","int2","values","skills","result"];
let state = fresh();
let idx = 0;
let isSample = false;
function fresh() { return { basic: {}, interest: Array(12).fill(null), values: [], skills: [] }; }
function save() { try { localStorage.setItem("senior-compass", JSON.stringify({ state, idx, isSample })); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem("senior-compass");
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.state && Array.isArray(d.state.interest)) { state = d.state; idx = Math.min(d.idx || 0, SCREENS.length - 1); isSample = !!d.isSample; }
  } catch (e) {}
}

const app = document.getElementById("app");
const bar = document.getElementById("bar");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const josa = (w, j) => {
  const c = String(w).charCodeAt(String(w).length - 1);
  if (c < 44032 || c > 55203) return j.split("/")[0];
  return ((c - 44032) % 28 > 0) ? j.split("/")[0] : j.split("/")[1];
};

function go(i) {
  idx = i; save(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
  const h = app.querySelector("h1, h2"); if (h) { h.setAttribute("tabindex","-1"); h.focus({ preventScroll: true }); }
}

function render() {
  const s = SCREENS[idx];
  bar.style.width = (idx === 0 ? 0 : Math.round(idx / (SCREENS.length - 1) * 100)) + "%";
  if (s === "intro") return renderIntro();
  if (s === "basic") return renderBasic();
  if (s.startsWith("int")) return renderInterest(+s.slice(3));
  if (s === "values") return renderValues();
  if (s === "skills") return renderSkills();
  return renderResult();
}

function stepHead(n, title, sub) {
  return `<div class="stack" style="gap:.5rem"><p class="eyebrow">${n}단계 / 4단계</p><h2>${title}</h2>${sub ? `<p class="lead">${sub}</p>` : ""}</div>`;
}
function navHtml(nextLabel) {
  return `<div id="err" hidden class="err" role="alert"></div><div class="nav"><button class="btn plain" id="prev" type="button">이전</button><button class="btn" id="next" type="button">${nextLabel || "다음"}</button></div>`;
}
function bindNav(validate) {
  app.querySelector("#prev").onclick = () => go(idx - 1);
  app.querySelector("#next").onclick = () => {
    const msg = validate();
    const e = app.querySelector("#err");
    if (msg) { e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    go(idx + 1);
  };
}

/* ---------- 채점 ---------- */
function typeScores() {
  const sum = { R:0,I:0,A:0,S:0,E:0,C:0 };
  INTEREST.forEach(([t], k) => sum[t] += (state.interest[k] ?? 2));
  const out = {};
  for (const t in sum) out[t] = sum[t] / 8; // 문항 2개 × 최대 4점
  return out;
}
function scoreJob(job, ts) {
  const b = state.basic;
  let wsum = 0, isum = 0;
  for (const t in job.r) { wsum += job.r[t]; isum += job.r[t] * ts[t]; }
  const interest = isum / wsum;
  const vHit = job.v.filter(v => state.values.includes(v));
  const value = state.values.length ? vHit.length / Math.max(1, Math.min(3, state.values.length)) : .5;
  const sHit = job.s.filter(s => state.skills.includes(s));
  const skill = state.skills.length ? Math.min(1, sHit.length / Math.max(1, Math.min(2, job.s.length || 1))) : .3;
  let base = .45 * interest + .2 * Math.min(1, value) + .25 * skill + .1;
  const cautions = [];
  let mult = 1;
  const phys = +b.phys || 2;
  if (job.phys > phys) { mult *= job.phys - phys === 1 ? .78 : .55; cautions.push("생각하신 것보다 몸을 많이 쓰는 일입니다."); }
  if (b.hours && !job.hours.includes(b.hours)) { 
    mult *= .8; 
    const hl = { light: 1, mid: 2, full: 3 };
    const uHour = hl[b.hours];
    const jMin = Math.min(...job.hours.map(h => hl[h]));
    const jMax = Math.max(...job.hours.map(h => hl[h]));
    if (uHour < jMin) cautions.push("원하시는 것보다 근무 시간이 긴 편입니다.");
    else if (uHour > jMax) cautions.push("원하시는 만큼 일할 시간이 나오지 않을 수 있습니다.");
    else cautions.push("근무 시간 조건이 다를 수 있습니다.");
  }
  if (b.place === "home") { if (job.remote === 0) { mult *= .6; cautions.push("현장에 나가서 하는 일입니다."); } else if (job.remote === 1) mult *= .9; }
  const inc = +b.income || 2;
  if (job.income < inc) { mult *= job.income === inc - 1 ? .82 : .62; cautions.push("기대하시는 수입보다 적을 수 있습니다."); }
  const careerHit = b.career && job.career.includes(b.career);
  let score = base * mult + (careerHit ? .05 : 0);
  score = Math.max(0, Math.min(.97, score));
  const reasons = [];
  const topTypes = Object.entries(job.r).sort((a,b) => b[1]-a[1]).filter(([t]) => ts[t] >= .6).slice(0,2).map(([t]) => TYPES[t].name);
  if (topTypes.length) reasons.push(`${topTypes.join("·")} 성향과 잘 맞습니다.`);
  if (vHit.length) reasons.push(`중요하게 여기시는 ‘${vHit.map(v => LBL[v]).join("’, ‘")}’을 채울 수 있습니다.`);
  if (sHit.length) reasons.push(`가진 강점(${sHit.map(s => LBL["s_"+s]).join(", ")})을 바로 쓸 수 있습니다.`);
  if (careerHit) reasons.push(`${CAREER[b.career]} 분야 경력을 살릴 수 있습니다.`);
  if (!reasons.length) reasons.push("근무 조건이 원하시는 것과 비슷합니다.");
  return { job, score, reasons, cautions };
}
function fitLabel(p) { return p >= 70 ? "매우 잘 맞음" : p >= 55 ? "잘 맞음" : p >= 40 ? "고려해 볼 만함" : "조건 확인 필요"; }

/* ---------- 결과 사진 만들기 ---------- */
const IMG = { bg:"#F1F5F3", card:"#FFFFFF", ink:"#17221E", muted:"#4B5D55", line:"#CFDBD5", accent:"#1C6A4F", soft:"#E0EEE7", gold:"#A9690A", goldSoft:"#F6EBD2", warn:"#9A3B1E" };
const F_DISP = '"Gowun Batang", "Nanum Myeongjo", serif';
const F_BODY = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

function wrapLines(ctx, text, maxW) {
  const out = []; let line = "";
  for (const word of String(text).split(" ")) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width <= maxW) { line = test; continue; }
    if (line) out.push(line);
    if (ctx.measureText(word).width <= maxW) { line = word; continue; }
    line = "";
    for (const ch of word) { if (ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch; }
  }
  if (line) out.push(line);
  return out;
}
function paintResult(ctx, d) {
  const W = 1080, P = 72, CW = W - P*2;
  let y = 0;
  const text = (t, x, size, opts = {}) => {
    ctx.font = `${opts.weight || 400} ${size}px ${opts.font || F_BODY}`;
    ctx.fillStyle = opts.color || IMG.ink; ctx.textAlign = opts.align || "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText(t, x, y);
  };
  const para = (t, x, size, maxW, lh, opts = {}) => {
    ctx.font = `${opts.weight || 400} ${size}px ${opts.font || F_BODY}`;
    for (const l of wrapLines(ctx, t, maxW)) { y += lh; text(l, x, size, opts); }
  };
  const rrect = (x, yy, w, h, r, fill, stroke) => {
    ctx.beginPath(); ctx.roundRect(x, yy, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  };

  ctx.fillStyle = IMG.bg; ctx.fillRect(0, 0, W, ctx.canvas.height);
  // 머리
  ctx.fillStyle = IMG.accent; ctx.fillRect(0, 0, W, 14);
  y = 110; text("새일 나침반 · 은퇴 후 일자리 적성 검사", P, 28, { weight: 600, color: IMG.accent });
  y += 18; para(`${d.name}의 다음 일터 지도`, P, 62, CW, 80, { font: F_DISP, weight: 700 });
  y += 14; para(`${TYPES[d.top[0]].name}과 ${TYPES[d.top[1]].name} 성향이 강합니다.${d.vals.length ? ` 일에서 ${d.vals.join(", ")}${josa(d.vals[d.vals.length - 1], "을/를")} 중요하게 여기십니다.` : ""}`, P, 34, CW, 52, { font: F_DISP, color: IMG.muted });
  if (d.sample) { y += 50; text("※ 예시 답변으로 만든 결과입니다", P, 26, { weight: 600, color: IMG.gold }); }

  // 흥미 유형
  y += 90; text("흥미 유형", P, 40, { font: F_DISP, weight: 700 });
  y += 20;
  d.ranked.forEach(([t, v], i) => {
    y += 58;
    text(TYPES[t].name, P, 30, { weight: 600 });
    const bx = P + 170, bw = CW - 170 - 80;
    rrect(bx, y - 24, bw, 24, 12, IMG.line);
    rrect(bx, y - 24, Math.max(24, bw * v), 24, 12, i < 2 ? IMG.accent : IMG.muted);
    text(String(Math.round(v * 100)), W - P, 28, { align: "right", color: IMG.muted });
  });

  // 추천 일자리
  y += 100; text("잘 맞는 일자리 다섯 가지", P, 40, { font: F_DISP, weight: 700 });
  y += 24;
  d.best.forEach((r, i) => {
    const j = r.job, p = Math.round(r.score * 100);
    const top0 = y + 20;
    // 높이 미리 계산
    ctx.font = `400 27px ${F_BODY}`;
    const inner = CW - 64;
    const lines = [...r.reasons.map(t => ["✓ " + t, IMG.ink]), ...r.cautions.map(t => ["! " + t, IMG.warn])]
      .flatMap(([t, c]) => wrapLines(ctx, t, inner).map(l => [l, c]));
    const prep = wrapLines(ctx, "준비할 것 · " + j.prep, inner);
    const where = wrapLines(ctx, "알아볼 곳 · " + j.where, inner);
    const h = 150 + lines.length * 40 + 24 + (prep.length + where.length) * 40 + 56;
    rrect(P, top0, CW, h, 24, IMG.card, IMG.line);
    y = top0 + 72;
    text(String(i + 1), P + 32, 52, { font: F_DISP, weight: 700, color: IMG.accent });
    text(j.name, P + 90, 40, { font: F_DISP, weight: 700 });
    text(`${p}점`, W - P - 32, 42, { weight: 700, align: "right" });
    y += 38;
    text(j.cat, P + 90, 24, { color: IMG.muted });
    text(fitLabel(p), W - P - 32, 24, { color: IMG.muted, align: "right" });
    y += 10;
    // 칩
    let cx = P + 32;
    [[PHYS_TXT[j.phys], IMG.soft], [REMOTE_TXT[j.remote], IMG.soft], [INCOME_TXT[j.income], IMG.goldSoft]].forEach(([t, c]) => {
      ctx.font = `500 23px ${F_BODY}`; const w = ctx.measureText(t).width + 32;
      rrect(cx, y + 14, w, 40, 20, c); const yy = y; y += 42; text(t, cx + 16, 23, { weight: 500 }); y = yy; cx += w + 10;
    });
    y += 64;
    lines.forEach(([l, c]) => { y += 40; text(l, P + 32, 27, { color: c }); });
    y += 24;
    prep.forEach(l => { y += 40; text(l, P + 32, 27, { color: IMG.muted }); });
    where.forEach(l => { y += 40; text(l, P + 32, 27, { color: IMG.muted }); });
    y = top0 + h;
  });

  if (d.next && d.next.length) {
    y += 90; text("함께 살펴볼 만한 일", P, 40, { font: F_DISP, weight: 700 });
    y += 10;
    d.next.forEach(r => {
      y += 60;
      text(r.job.name, P, 30, { weight: 600 });
      const nmW = ctx.measureText(r.job.name).width;
      text(r.job.cat, P + nmW + 16, 24, { color: IMG.muted });
      text(Math.round(r.score * 100) + "점", W - P, 30, { align: "right" });
      y += 36;
      text(r.cautions[0] || r.reasons[0], P, 24, { color: IMG.muted });
      y += 30;
      ctx.fillStyle = IMG.line; ctx.fillRect(P, y, CW, 1);
    });
  }

  y += 90; text("이렇게 시작해 보세요", P, 40, { font: F_DISP, weight: 700 });
  y += 30;
  const steps = [
    ["1", "위 다섯 가지 중 두 가지를 고르세요", "마음이 가장 끌리는 것과 가장 현실적인 것을 하나씩 고르면 좋습니다."],
    ["2", "가까운 상담 창구를 찾아가세요", "중장년내일센터나 시니어클럽에서 결과를 보여주면 맞는 공고를 찾아줍니다."],
    ["3", "짧은 교육이나 체험부터 해 보세요", "바로 취업하기보다 교육이나 공익활동으로 먼저 경험해 보면 실패 부담이 적습니다."]
  ];
  steps.forEach(([n, t, desc]) => {
    y += 30;
    text(n, P, 36, { font: F_DISP, weight: 700, color: IMG.accent });
    text(t, P + 40, 30, { weight: 600 });
    y += 36;
    para(desc, P + 40, 24, CW - 40, 36, { color: IMG.muted });
    y += 20;
  });

  // 찾을 곳
  y += 90; text("일자리를 찾을 수 있는 곳", P, 40, { font: F_DISP, weight: 700 });
  y += 10;
  CHANNELS.forEach(c => { y += 54; text(c.n, P, 30, { weight: 600 }); text(c.u.replace("https://", ""), W - P, 26, { color: IMG.accent, align: "right" }); });
  y += 70;
  ctx.fillStyle = IMG.line; ctx.fillRect(P, y - 30, CW, 2);
  const dt = new Date();
  para(`${dt.getFullYear()}. ${dt.getMonth() + 1}. ${dt.getDate()} 검사 · 결과는 방향을 잡기 위한 참고 자료입니다. 모집 조건은 시기와 지역마다 다르니 최신 공고를 확인하세요.`, P, 24, CW, 36, { color: IMG.muted });
  return y + 70;
}
async function buildImage(d) {
  try { await Promise.all([document.fonts.load(`700 40px "Gowun Batang"`), document.fonts.load(`400 27px "IBM Plex Sans KR"`), document.fonts.load(`600 27px "IBM Plex Sans KR"`)]); } catch (e) {}
  const c = document.createElement("canvas"); c.width = 1080; c.height = 6000;
  const h = paintResult(c.getContext("2d"), d);
  c.height = Math.ceil(h);
  paintResult(c.getContext("2d"), d);
  return new Promise(res => c.toBlob(b => res(b), "image/png"));
}
async function saveImage(btn, parts) {
  const d = { ...parts, name: state.basic.name ? state.basic.name + "님" : "나", sample: isSample };
  const label = btn.textContent; btn.disabled = true; btn.textContent = "사진 만드는 중…";
  try {
    const blob = await buildImage(d);
    if (!blob) throw new Error("no image");
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    const fname = `새일나침반_결과_${state.basic.name || "나"}.png`;
    if (dl) {
      try { await dl.save({ filename: fname, data: blob }); toast("사진을 저장했습니다"); }
      catch (err) {
        if (err && err.code === "declined") toast("저장을 취소했습니다");
        else if (err && err.code === "rate_limited") toast("잠시 후 다시 눌러 주세요");
        else showImgFallback(blob);
      }
    } else showImgFallback(blob);
  } catch (e) { toast("사진을 만들지 못했습니다. 다시 눌러 주세요"); }
  finally { btn.disabled = false; btn.textContent = label; }
}
function showImgFallback(blob) {
  const box = app.querySelector("#imgfallback"), img = app.querySelector("#resultimg");
  if (!box || !img) return;
  img.src = URL.createObjectURL(blob); box.hidden = false;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ---------- 글자 크기 ---------- */
function setSize(px) {
  document.documentElement.style.setProperty("--base", px + "px");
  document.querySelectorAll(".sizer button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.size === String(px))));
  try { localStorage.setItem("senior-compass-size", px); } catch (e) {}
}
document.querySelectorAll(".sizer button").forEach(b => b.onclick = () => setSize(+b.dataset.size));
try { const s = localStorage.getItem("senior-compass-size"); if (s) setSize(+s); } catch (e) {}
document.getElementById("home").onclick = () => go(0);
document.getElementById("gohome-right").onclick = () => go(0);

load();
if (idx !== 0 && SCREENS[idx] !== "result") idx = idx; // 이어서 진행
render();
})();
</script>
